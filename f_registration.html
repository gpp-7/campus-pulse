<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GP Patna-7 | Faculty Registration Request</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-100">

    <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-700">
        <div class="mb-6">
            <a href="index.html" class="text-xs font-bold text-emerald-400 hover:text-emerald-300 flex items-center gap-1.5 mb-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
            <h1 class="text-2xl font-black text-white">Faculty Registration Portal</h1>
            <p class="text-xs text-slate-400 mt-1">Official credentials register karein taaki attendance tokens broadcast kar sakein.</p>
        </div>

        <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-xs font-bold border"></div>

        <form id="faculty-reg-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Full Name (with Prefix)</label>
                <input type="text" id="f-name" placeholder="e.g., Dr. R. K. Singh" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Designation</label>
                    <select id="f-designation" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-emerald-500">
                        <option value="" disabled selected>Select Designation</option>
                        <option value="HOD">HOD (Head of Department)</option>
                        <option value="Lecturer">Lecturer</option>
                        <option value="Senior Lecturer">Senior Lecturer</option>
                        <option value="Lab Assistant">Lab Instructor</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Department</label>
                    <select id="f-dept" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-emerald-500">
                        <option value="" disabled selected>Select Department</option>
                        <option value="Computer Science & Engg.">Computer Science & Engg.</option>
                        <option value="Civil Engg.">Civil Engg.</option>
                        <option value="Mechanical Engg.">Mechanical Engg.</option>
                        <option value="Electrical Engg.">Electrical Engg.</option>
                        <option value="Electronics Engg.">Electronics Engg.</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Official Email ID</label>
                    <input type="email" id="f-email" placeholder="name@gpp7.in" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Cabin / Room No.</label>
                    <input type="text" id="f-cabin" placeholder="e.g., Room 102" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                <input type="password" id="f-pass" minlength="6" placeholder="Min 6 characters" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition-all text-sm mt-3 cursor-pointer">
                Submit Faculty Registration
            </button>
        </form>
    </div>

    <script>
        const API_URL = "https://campus-pulse-gpp-7.onrender.com/api";

        document.getElementById('faculty-reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');

            const payload = {
                name: document.getElementById('f-name').value.trim(),
                designation: document.getElementById('f-designation').value,
                department: document.getElementById('f-dept').value,
                email: document.getElementById('f-email').value.trim(),
                cabinNumber: document.getElementById('f-cabin').value.trim(),
                password: document.getElementById('f-pass').value
            };

            try {
                const res = await fetch(`${API_URL}/register/faculty`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    alertBox.className = "mb-4 p-3 rounded-xl text-xs font-bold border bg-emerald-950/60 border-emerald-800 text-emerald-300";
                    alertBox.innerText = "Faculty registration complete! Redirecting to login...";
                    alertBox.classList.remove('hidden');
                    setTimeout(() => window.location.href = "index.html", 1500);
                } else {
                    alertBox.className = "mb-4 p-3 rounded-xl text-xs font-bold border bg-rose-950/60 border-rose-800 text-rose-300";
                    alertBox.innerText = data.message || "Registration failed!";
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.className = "mb-4 p-3 rounded-xl text-xs font-bold border bg-rose-950/60 border-rose-800 text-rose-300";
                alertBox.innerText = "Error: Backend server is offline.";
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
